name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run the real sentence-transformer model (loads Small BERT, runs live inference)
        run: python main.py
      - name: Run the real multi-task architecture + training loop
        run: |
          python models/multitask_model.py
          python models/train_multitask.py

  finetuning-adapter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r finetuning/requirements.txt
      - name: Run the real LoRA adapter regression test (real base model + real committed adapter, no mocks)
        run: python -m unittest tests.test_finetuned_adapter -v
